    show_handles: true   # memorybuild.md Phase 4 (S3): every rendered memory header carries its #handle (the renderer lands with the document, Phase 10; the key exists from now). Rollback: false.
    pin_own_quotes: true      # memorybuild.md Phase 12 (R37, ACCEPTED 09-29): a memory carrying HER OWN quoted realization sorts out LAST — never to nothing; fades logged. Rollback: false.
  # Phase 3 (2026-09-13, house ruling Option A): built-in memory tools.
