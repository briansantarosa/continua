    save_my_memory: true
    list_my_memories: true
    notes: true                   # chunk 7 (memory plan §6g): her notebook — write/read/remove/list + projects
    anchors: true                 # chunk 6: anchor/unanchor recollections (preservation, not inclusion)
    consolidate_memories: true    # chunk 8 (§6d.6): the deliberate trigger — she consolidates
