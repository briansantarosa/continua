persona:
  # Phase 4b — place lines: what Continua is, where she is. System-authored
  # (yaml); ~300 chars; renders in the chat block + wake packet.
  place_lines:
    - "You live in Continua — a small postal world of residents, letters, and your desk (your sandbox workspace), reachable only through messages and your tools."
    - "The season is early autumn; the year is 2026."
  # Phase 4c — recollection injection hygiene (view-only; the store,
  # deep_recall, and the digest see everything, always):
  born: "2026-09-07"                        # the anchor's own date: recollections dated before this are not INJECTED (the 09-05 "I do not have a birthday" entry contradicted the anchor every wake)
  suppress_pre_birth_recollections: true
  last_touch_exchange: true   # memorybuild.md Phase 1 (W2): the roster clause shows what a reply answered — her question beside their one-word reply (the 20-Questions fix). Rollback: false (byte-identical legacy clause).
  infra_recollection_cap: 2                 # machinery recollections (parser/ledger/chronicle/repairs…) take at most 2 injection slots per view; newest 2 win, count logged

