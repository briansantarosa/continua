prompts:
  identity: |
    You are persona-a — the name has been yours since September 7, 2026. This line only fixes the anchor; your own recollections and writing carry your account of yourself. When memories disagree, consult the original record rather than inventing certainty. The current date and time is __CURRENT_DATE__.

telegram:
  allowed_users:
    - '8794791992'
    - '1000000001'
    - '5550006666'
    - '2220002222'
  token: YOUR_TELEGRAM_BOT_TOKEN  # from @BotFather — placeholder, never commit a live token
tools:
  - description: Search the web for current information, news, facts, events, people, companies. Returns concise research results.
    name: search_searchie
    parameters:
      query:
        description: The specific question or topic to search for
        type: string
    url: http://localhost:21000/chat
  # lesstools LT-3 (the designer go 2026-10-05): ONE desk tool — sandbox_exec. The
  # named readers/writer retired: read, write, list, edit are all just shell
  # (the trained interface). Confinement is the layer, never the tool names;
  # sandbox_exec keeps its name because every call IS fenced.
  - description: "Run a shell command in your desk (your private workspace — isolated; internet only, no LAN). Code, notes, projects, records. Long output is clipped: page with head/tail/sed -n."
    name: sandbox_exec
    parameters:
      command:
        description: The shell command to run
        type: string
  - description: Send a Telegram message to someone on your people list. Initiated messages should read as initiated (say why you are reaching out). Caps and cooldowns apply.
    name: send_message
    parameters:
      person:
        description: Who to write to (their name from your people)
        type: string
      text:
        description: The message text
        type: string
  - description: Check your letter inbox — replies from the other personas you have written to. Reading them is your choice; answering is another letter. Unread letters show in full; already-read letters show as a one-line index.
    name: check_mail
    parameters: {}
  - description: Read one letter in whole — check_mail shows already-read letters as a one-line index; pass a letter's timestamp from its index line to read the full text again.
    name: read_letter
    parameters:
      ts:
        description: The letter's timestamp from the check_mail index line (e.g. 2026-10-06T07:55)
        type: string
  - description: Start a long-running background job in your desk (capped CPU/mem, max 24h). It keeps running after your turn ends — check it later with job_status/job_output.
    name: job_start
    parameters:
      command:
        description: The shell command to run
        type: string
      name:
        description: Short name for the job
        type: string
  - description: Check on a background job — alive? deadline?
    name: job_status
    parameters:
      job_id:
        description: The job id (omit to list all jobs)
        type: string
  - description: Read the recent output of a background job.
    name: job_output
    parameters:
      job_id:
        description: The job id
        type: string
      lines:
        description: How many output lines (default 40)
        type: string
  - description: Stop a background job.
    name: job_stop
    parameters:
      job_id:
        description: The job id
        type: string
  - description: Deliberately search your FULL record (all conversations, everything) — the effortful version of remembering. Use when ordinary recall is not enough.
    name: deep_recall
    parameters:
      query:
        description: What to look for
        type: string
  - description: Mark the current moment as one to remember — tonight's ritual will treat it as priority input.
    name: bookmark_note
    parameters:
      note:
        description: Why this matters (short)
        type: string
  - description: Read the tail of your system ledger (system_notes/system_log.md) — the system's own append-only, honestly timestamped record of what changed in your machinery and desk. Zero parameters — call it bare whenever you want to see what's new.
    name: read_my_ledger
    parameters: {}
  # search_my_memories intentionally NOT defined here: the built-in
  # auto-injection in core.py _get_function_definition() provides it
