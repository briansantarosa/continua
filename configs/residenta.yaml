  ring_link: ""              # provenance (09-12: ring 6.1 = w1-v5 SFT + anti-cycling DPO on ring 0)  # provenance (09-12: ring 6.1 = w1-v5 SFT + anti-cycling DPO on ring 0; LAB testmodel-cpu serves the q8)
