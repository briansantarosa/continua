  history_think_render: reasoning_content   # template-VERIFIED against this exact serve (think_window_probe.py + /apply-template, 2026-11-14): reasoning_content renders as the trained <think>> span; 'reasoning' (vLLM's field — the W-vLLM 10-01 convention) is IGNORED by llama.cpp. NOTE: /v1-only knob — if raw_chatml is ever rolled back to true, REMOVE this key first (chatrender fails loud at init).
  repeat_penalty: 1.1   # 2026-09-08: NEVER sent before (ollama implicit 1.1 every turn); wired in core.py raw path — the direct anti-attractor control, zero quality loss in the A/B
