elope) and sheds older exchanges before failing. WAS 14000 (the 4K-falloff-era value; the raw-era ruling is kept in git history). 2026-09-12 house ruling: same 16K-token context as residentb (59000 chars at ~3.7 chars/tok measured density). WAS 14000 (the 4K falloff cap). Server check: lab ollama testmodel-cpu:latest has num_ctx 81920 (via /api/show) so 16K fits trivially. AMENDED 2026-09-13 (the designer): 59000 is now the TOTAL prompt ceiling — the raw-history window got its own explicit cap (llm.max_history_chars: 20000, applied directly) and the freed ~18K belongs to the other layers (summaries, memories, books) to grow into. Per-turn verification line: '[Core] prompt budget:'
