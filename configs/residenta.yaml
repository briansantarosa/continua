    producer: false              # §7.6 (2026-09-19 house ruling): extraction OFF — the store is a read-only archive; rollback = true
  injection:
    recollections: {enabled: true}  # sizing is DERIVED (§4c: the absolute caps are retired — the recollection budget is the room the turn has left, split by band shares; cap_bytes has no effect and is not read on the derived path)
