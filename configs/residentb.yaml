  paused: false
  paused_reason: ""
  wake:
    enabled: true           # LIVE 2026-09-11 (design ruling: full parity with residenta) — 15-min cadence, same interval gate
    # 2026-09-30 (the designer): 15 → 60 — four fewer server occupancies per hour;
    # the wake grid still fires at HH:MM:57, residentb is due every 4th firing
