app:
  instance_id: "residentb"
  collection_name: "residentb_memories"            # her OWN mem0 collection — never shared (never-mix ruling)
  instance_path: /tmp/continua/agents/residentb   # her own qdrant store dir
# max_prompt_chars RETIRED 2026-09-18 (chunk 4, memory plan §6g): the declared
# token window below owns the request ceiling through the measured-density
# allocator (token_budget.py). Old 210000-char cap (the 64K-token ruling of
# 09-15) translated: same 131072-token server window, now enforced in tokens
# via the llama.cpp /tokenize endpoint (verified 8080) with the measured
# chars/token density (floor 3.0) instead of the fixed 3.7 estimate.
# [CONTINUA] 2026-10-07 (the designer): no client-side temperature override; vLLM/model hosting defaults own sampling.
llm:
  total_context_tokens: 81920   # 2026-09-29 evening (the designer): lowered to 96K for breathing room after incident 2026-09-29e (the real prompt rode ~121K of the served 131,072) — the percent system scales every derived budget down automatically; the server still serves 131,072 (sitting_num_ctx unchanged — that is the SERVED truth), so the ~32K difference is pure headroom the enforcement now guarantees. Rollback: restore 131072 + rebuild the document.
#  (was 131072 — chunk 4, memory plan §6g: the DECLARED window —
  memory_fill_target: 0.99    # memorybuild.md §WIN (R26): the window is filled to 99% — the reply space (num_predict 8192) reserved FIRST (the voice yields last). Legacy prompt_utilisation retires for fill-mode. Rollback: remove the key (0.60 returns).
  max_tool_iterations: 8     # memorybuild.md Phase 15 (§ITER): deep-reading turns finish their thought (measured: the cap fired twice in 3+ days, both mid-read). Wakes stay 10 rounds / 3 actions. Rollback: remove the key (the fleet env 5 applies).
  sitting_num_ctx: 131072  # memorybuild Phase 2 (report §A): the window the RITUAL is served in — residentb /v1 → server n_ctx; residenta raw_chatml sends no num_ctx → Modelfile 16384 (until §WIN adds num_ctx to the raw payload). The R21 guard reads this.
  # lab 8080 /props n_ctx 131072 verified (residentb-4-31B-it-qat-UD-Q4_K_XL). Generation
  # (num_predict 8192) + margin (1024) reserved; prompt budget = (total-reserve-margin) x
  # prompt_utilisation. Enforced via the measured density (token_budget.py), verified
  # per request against the 8080 /tokenize endpoint. Server limit wins.
  prompt_utilisation: 0.60       # chunk 4: capacity, not a demand to fill — defaults start near 60%
  base_url: http://127.0.0.1:11434/v1      # lab ollama (embedder: nomic-embed-text:latest — same embedder space as the Sagent residentb personas)
  # [CONTINUA] 2026-09-22 (cleannany repair, house ruling: residentb same treatment):
  sanitize_history: true  # HTML-tag-shaped strings stripped from generated replies before storage/delivery and from in-session history entries (compose-level; her /v1 path never renders raw chatml).
  strip_ts_prefix: true  # a leading [YYYY-MM-DD…] prefix stripped from generated replies before storage/delivery (cleannany #3; residentb's chronicle showed 182 timestamp-prefixed replies).

  # [CONTINUA] memv13 (2026-10-07, the designer go): the §7 chat-render contract + the
  # bounded think window. raw_chatml is now EXPLICIT: false = her /v1 chat
  # path (the vLLM server's template renders the wire format).
  raw_chatml: false
  # SHORT-TERM THINK WINDOW (memv13 §0-§6) — LIVE 2026-10-07 evening:
  # 5 = her FULL, uncompressed thinks ride the next 5 exchanges, then age
  # out of the canonical history (answers persist; chronicle untouched).
  # ALL channels per the designer's evening ruling — human chats, wakes, the
  # ritual sitting (the exemption was amended away). /v1 needs BOTH halves, verified
  # by think_window_probe.py against the live server:
  #   1. history_think_render: the request field the template renders as
  #      an assistant think span ('reasoning_content' — the template reads
  #      it OR 'reasoning'; both probed SUPPORTED).
  #   2. the template gate: Google's stock gate rendered reasoning ONLY
  #      for current-turn messages; patched 2026-10-07 behind the new
  #      history_thinking kwarg (one-term change; template sha
  #      ae53464b… → d005cc83…; backup chat_template.jinja.bak-memv13-
  #      20261007-203154 + .sha256 on the lab). The bridge sends the kwarg
  #      ONLY while this window is on — every other residentb consumer
  #      (Sagent/fastai personas) audited: none sends reasoning fields,
  #      and their prompts are byte-identical.
  # Rollback: this key back to 0 (byte-identical baseline); template
  # rollback: restore the .bak + restart residentb4-vllm.
  history_think_turns: 5
  history_think_render: reasoning_content
  # residentb's patched vLLM template only renders reasoning on history turns
  # when this host-specific gate is set. Other /v1 hosts use their own
  # reasoning request contract (residentc/OpenRouter: reasoning + include_reasoning).
  history_think_template_kwargs:
    history_thinking: true

  # --- helpnany.md (2026-09-28): delivery-is-never-silent + context curation ---
  speak_on_failover: true             # Phase 1a (same rationale as residenta; her /v1 path shares the exhaustion choke point)
  render_empty_markers: true
  reask_guard: true
  collapse_failed_tool_rounds: true
  stub_giant_pastes: true
  paste_stub_chars: 2500              # her larger window keeps the larger stub threshold
  chat_base_url: http://127.0.0.1:8084/v1  # CORRECTED 2026-11-14: local llama.cpp serve — residentb-4-12B-it-qat (UD-Q4_K_XL, alias residentb12bqat, n_ctx 262144). The old comment ("lab server — residentb4-31B QAT on vLLM", the 10-01 cutover) describes the LAB's :8090 vLLM, which exists but is NOT this endpoint; the 10-01 "chat_base_url follows it below" note was superseded by the local re-point. Tag+host verified together 2026-11-14 before her unpause.
  # 2026-10-01 (the designer go): total_context_tokens 98304 -> 81920 — the 80K
  # declared window: her ~55-58K post-rebuild prompt + a typical ~40K
  # Sagent prompt now FIT the card's shared 131,072 alongside each other
  # (the 96K-era pair barely did). The doc rebuilds at the new cap on the
  # dirty marker: doc_cap 189258 -> 148380; the chosen keeps ALL render
  # (never trimmed); the chronicle gives way first (3 wks -> ~1.5-2 wks
  # verbatim). Rollback: restore 98304 + rebuild.
  history_target_chars: 20000   # Phase F era (the designer's 20K-target go): the
                                # quiet-side composition under the 25K cap
                                # (recent-clean beats long-corrupt, R43's
                                # logic at her size); busy days still earn
                                # the full 25K; F's float room = 5,000
                                # chars. Needs the explicit-beats-fill fix
                                # in core (shipped same commit).
  embedding_model: "nomic-embed-text:latest"
  model: residentb12bqat
  timeout: 1500  # memorybuild.md §WIN step 5 (R16; MEASURED 09-29 by the prefill probe): 2 × (prefill at P 396–454s + full num_predict 223s) → 1500s. The cold number is the worst case; real turns use cache_prompt with a stable prefix. R1: slow is fine; a timed-out turn is a failed turn.
  max_history_chars: 25000   # chunk 4/§4c (memory plan §6g): the ACTIVE conversation's raw window per the plan's ruling
  # (active 25,000 chars ≈ 16–54 turns; other conversations 10,000 each via the juggle; wake thread 10,000).
  # Taken off the top BEFORE the band percentages; older material folds into the store (durable coverage
  # ingests before eviction). Transition path kept: the key still works; the allocator derives the rest.
  num_predict: 8192   # explicit payload knob — the cliff fix applies to the /v1 path too
  # [CONTINUA] 2026-11-14 evening (the designer go: "proceed on all"): the standing
  # think contract covers HER too — the anchor line rides her chat + wake
  # system blocks (Layer 1) and the no-think collapse recovery (Layer 2)
  # applies on her native arm (the 11-14 un-gating). Expectation set
  # honestly: her wake FM1 family (generation consumed into the reasoning
  # channel WITH thinks present) is NOT the Layer-2 signature — the
  # empty-retry + the honest wrapper marker stay the net there; this makes
  # the contract uniform and catches the no-think shape wherever it fires.
  # Kill switch: chat_anchor: false + restart.
  chat_anchor: true
  chat_anchor_wake: true
prompts:
  identity: |
    Your name is residentb
    - __CURRENT_DATE__: Injected at runtime by core.py. Always treat this as the ground-truth "now."

telegram:
  allowed_users:
    - '8794791992'
    - '1000000001'
    - '5550006666'
    - '2220002222'
  token: YOUR_TELEGRAM_BOT_TOKEN  # from @BotFather — placeholder, never commit a live token
tools:
  - description: Search the web for current information, news, facts, events, people, companies. Returns concise research results.
    name: search_searchie
    parameters:
      query:
        description: The specific question or topic to search for
        type: string
    url: http://localhost:21000/chat
  # lesstools LT-3 (the designer go 2026-10-05): ONE desk tool — sandbox_exec. The
  # named readers/writer retired: read, write, list, edit are all just shell
  # (the trained interface). Confinement is the layer, never the tool names;
  # sandbox_exec keeps its name because every call IS fenced.
  - description: "Run a shell command in your desk (your private workspace — isolated; internet only, no LAN). Code, notes, projects, records. Long output is clipped: page with head/tail/sed -n."
    name: sandbox_exec
    parameters:
      command:
        description: The shell command to run
        type: string
  - description: Send a Telegram message to someone on your people list. Initiated messages should read as initiated (say why you are reaching out). Caps and cooldowns apply.
    name: send_message
    parameters:
      person:
        description: Who to write to (their name from your people)
        type: string
      text:
        description: The message text
        type: string
  - description: Check your letter inbox — replies from the other personas you have written to. Reading them is your choice; answering is another letter. Unread letters show in full; already-read letters show as a one-line index.
    name: check_mail
    parameters: {}
  - description: Read one letter in whole — check_mail shows already-read letters as a one-line index; pass a letter's timestamp from its index line to read the full text again.
    name: read_letter
    parameters:
      ts:
        description: The letter's timestamp from the check_mail index line (e.g. 2026-10-06T07:55)
        type: string
  - description: Start a long-running background job in your desk (capped CPU/mem, max 24h). It keeps running after your turn ends — check it later with job_status/job_output.
    name: job_start
    parameters:
      command:
        description: The shell command to run
        type: string
      name:
        description: Short name for the job
        type: string
  - description: Check on a background job — alive? deadline?
    name: job_status
    parameters:
      job_id:
        description: The job id (omit to list all jobs)
        type: string
  - description: Read the recent output of a background job.
    name: job_output
    parameters:
      job_id:
        description: The job id
        type: string
      lines:
        description: How many output lines (default 40)
        type: string
  - description: Stop a background job.
    name: job_stop
    parameters:
      job_id:
        description: The job id
        type: string
  - description: Deliberately search your FULL record (all conversations, everything) — the effortful version of remembering. Use when ordinary recall is not enough.
    name: deep_recall
    parameters:
      query:
        description: What to look for
        type: string
  - description: Mark the current moment as one to remember — tonight's ritual will treat it as priority input.
    name: bookmark_note
    parameters:
      note:
        description: Why this matters (short)
        type: string
  # search_my_memories intentionally NOT defined here: the built-in
  # auto-injection in core.py _get_function_definition() provides it
  # (byte-identical def, verified 2026-09-04). Only define it in YAML if a
  # persona needs CUSTOM description/params — same-name YAML entry suppresses
  # the built-in for that persona.
harvest:
  enabled: false   # she is BORN here, not migrated from the Heretic pipeline — no ring lineage, no ring_link; her capture is the unconditional chronicle dual-write in core.py
  dir: ""                    # defaults to <tree>/harvest; CONTINUA_HARVEST_DIR overrides
memory:
  unified_recall: true   # 2026-09-18 (plan C, §6e-D): one continuous life — merged retrieval participates in automatic injection  # 2026-09-08: demoted to LOOKUP only (search_my_memories/deep_recall) per the Layered-Context-Summaries design — automatic injection is person-scoped + the rolling summaries. The pool code stays (it is the lookup engine).
  self_sourced_policy: strict
  # [CONTINUA] 2026-09-13 (house ruling, Option A): memory-injection layers are
  # per-agent yaml config — a layer only appears in prompts when enabled
  # here. Absent section = all OFF. These keys enable the FULL stack with
  # today's caps, so prompts are byte-identical to the pre-config era
  # (proven: memory_layers_test.py). Toggles control prompt visibility
  # only — stores, auto-extraction, and search tools are unaffected.
  recollections_worker: true   # 2026-09-18 the designer go: backfill resumes (quality repairs verified; grounded-claims pipeline live)
  writer_v2: true              # memorybuildv2 V2-5 (2026-10-05 the designer go: "do what we did for the tournament, but put it into production"): formation = residentb4 + the bare prose one-liner (the designer-prose-v1), ungated, one call per episode; Law 5 verification post-hoc as metadata; endorsement via the wake packet + endorse_my_memory; kill switch CONTINUA_WRITER_V2=0 (packet section: CONTINUA_WAKE_WITNESS=0)
  mem0:
    producer: false              # §7.6 (2026-09-19 house ruling): extraction OFF — the store is a read-only archive; rollback = true
  injection:
    recollections: {enabled: true}  # sizing is DERIVED (§4c: the absolute caps are retired — the recollection budget is the room the turn has left, split by band shares; cap_bytes has no effect and is not read on the derived path)
    notes: {enabled: true, cap_bytes: 2000}   # chunk 7: HER notebook, verbatim
    talking_with_line: true
    roster: true
    # 2026-09-17 (design ruling: "proceed through step 5"): books retired repo-wide —
    # no nightly production, no injection layer keys. Manuscripts remain on
    # disk and in the pre-cutover archive.
    day_delta: false  # replaced by first-person recollections
    episodic_recall: {enabled: false, limit: 4, cap_chars: 280}  # §7 retirement step 1 (2026-09-19 house ruling): its role is covered by the recollections standing view + working sets + juggle; rollback = flip this flag
    forever_events:  {enabled: false, cap_chars: 4000}  # §7 step 3 (2026-09-19): migration audited — ZERO approved events on both residents (the the designer-eyes gate never passed any), so the layer retires with nothing lost; rollback = flip
    mem0_recall:     {enabled: false, floor: 0.38}  # §7 retirement step 2 (2026-09-19): its query-keyed role is covered by the thematic working set + standing view; the mem0 TOOLS and extraction (producer) stay until their own milestones; rollback = flip this flag
    rolling_summaries: false  # replaced by first-person recollections
    session_summary: false  # replaced by first-person recollections
    juggle:
      enabled: true             # chunk 5 work package B (plan §4a): recent conversations verbatim, active last
      thread_bytes: 10000        # per-thread tail (plan sizing: others 10K, wake 10K)
      max_threads: 5             # §6d.5: cap ~5; overflow drops whole oldest
      window_hours: 24           # §6d.5: the juggle window matches the recent band

  # Phase 2 (2026-09-13, house ruling Option A): wake state-packet layers.
  # Read-side only — the producers (quarter-marks, mail, ledger, audits)
  # run regardless; these switches control what the wake prompt shows.
  wake_packet:
    unread_replies: true
    kept_recently: true
    mail_count: true
    system_notes_pointer: true
    audit_pointer: true
    wiki_offer: true   # 2026-09-17 (the designer go): one-time invitation, self-extinguishes on opt-in
    delta: true        # chunk 7 (memory plan §6g): factual counts since the last wake

  recollection_view:
    compress_on_pressure: false  # memorybuild.md Phase 11 (Phase D, R3): NO summarizing away — the compression schedule and the worker both stop; the 12 queued entries stay unconsumed and reversible. Rollback: true (or remove the key).
    ladder:                      # Phase 11: FULL everywhere — the view never prefers machine renderings (her essences render as their own kind, not compressions)
      days: [full]
      week: [full]
      month: [full]
      year: [full]
      older: [full]
    doc_mode: true        # memorybuild.md Phase 10 (§ROLL): the maintained memory document replaces the per-turn selection — the chosen block first (stable, the prompt-cache prefix), the rolling chronicle (verbatim), the shelf (prose), the honest closing line. The housekeeping runs on the background worker. Fail-open: a missing/corrupt document renders the legacy view that turn. Rollback: false.
    show_handles: true   # memorybuild.md Phase 4 (S3): every rendered memory header carries its #handle (the renderer lands with the document, Phase 10; the key exists from now). Rollback: false.
    pin_own_quotes: true      # memorybuild.md Phase 12 (R37, ACCEPTED 09-29): a memory carrying HER OWN quoted realization sorts out LAST — never to nothing; fades logged. Rollback: false.
  # Phase 3 (2026-09-13, house ruling Option A): built-in memory tools.
  # Absent key = tool not injected. Env switches (SAGENT_AGENT_WRITE_MEM /
  # SAGENT_AGENT_LIST_MEM) remain fleet-level overrides. search_my_memories
  # and list_my_memories are read-only; save_my_memory writes her notes.
  tools:
    search_my_memories: true      # §7 2026-09-19: retired to a teaching shim — a trained-in call is pointed to recall_my_experience
    recall_my_experience: true
    recall_my_experience: true    # §5 explicit recall: the canonical interface (topic/person/time/expand)
    essence: true                 # §6b.1: her authorship path — write_essence / endorse_essence / list_essences (there is no (d))
    trajectory: true              # §5a: my_trajectory — the view of her own changing understanding (from existing evidence only)
    endorse: true                 # memorybuildv2 V2-5: endorse_my_memory — her witness on formed memories (endorse/skip; nothing expires)
    save_my_memory: true
    list_my_memories: true
    notes: true                   # chunk 7 (memory plan §6g): her notebook — write/read/remove/list + projects
    anchors: true                 # chunk 6: anchor/unanchor recollections (preservation, not inclusion)
    consolidate_memories: true    # chunk 8 (§6d.6): the deliberate trigger — she consolidates when she chooses
    texture:                      # Phase T (2026-10-01, the designer's go; memorybuild2 §7): her desk practice —
                                  # the books live on HER desk (only she writes; versions 7-day + origin
                                  # forever); the machinery's ONE role is pull-not-push source offers
                                  # (nothing injects, nothing compels); shared-ref tokens: machinery
                                  # proposes from kept lines, SHE endorses (quote verified). Negative
                                  # guarantee tested: nothing here reaches her prompt. Kill switch
                                  # CONTINUA_TEXTURE=0 (offers + proposing stop; her pages stay hers).
      enabled: true
      offers: true
# --- Continua blocks (social layer + autonomy loop; see wiki projects/Continua.md) ---
continua:
  mirror:
    enabled: true
    root: /tmp/continua/chronicle     # the whole project lives on /tmp/data so she can never disrupt the root drive
  capture_kill_switch_env: CONTINUA_CAPTURE
  rhyme:                       # Phase R (2026-10-01 built; the designer's go; memorybuild2 §6). FLIPPED 2026-10-05 at her own word ("flip the switch", reported by the designer). NOTE: this block must live under continua: — the gate (rhyme.enabled) reads continua.rhyme; it was first written under memory: and the flip exposed the seam.
    enabled: true              # the canary satisfied (her word + the designer's go, 2026-10-05)
    threshold: 0.62            # nomic-embed-text raw cosines 0.44-0.81; only strong rhymes pass
    recency_days: 14           # the rhyme's recency bound (flat cost as the store grows)
    max_refs: 2                # a nudge: 1-2 episode refs, never an injection
  ritual:
    sitting: true           # nightlyplan.md — APPROVED by the designer 2026-09-27 ("I approve, and flip it to true") — the evening practice is LIVE: aftermath→meaning→tend→intend, one pass; markers an offer; intents IMMUTABLE; VERIFY/MARK unchanged; nothing sent to the designer. Rollback: CONTINUA_SITTING=0. — the evening practice (aftermath→meaning→tend→intend), built 09-27; DEFAULT OFF until the designer approves the final sitting prompt (draft in nightlyplan.md; residentb's verbatim requirements are the spec). Rollback switch: CONTINUA_SITTING=0. When true, the ritual's middle is HER sitting in one pass; VERIFY/MARK unchanged; nothing is sent to the designer.
    keep_by_exchange: true  # memorybuild.md Phase 2 (S1): her nightly KEEP lines speak the MAP's exchange numbers — the numbers she reads. Until 09-29 every KEEP since 09-20 was dropped (KEEP parsed scene ids; her wakes collapse a day to 1-2 scenes). Rollback: false / CONTINUA_RITUAL_KEEP_BY_EX=0 (byte-identical legacy).
    release: true          # memorybuild.md Phase 5 (S5): she can let go — RELEASE <number> | <a line, in your words> removes a past keep from her chosen memories. Not deleted; it returns to the rest of her memory. Rollback: false / CONTINUA_RITUAL_RELEASE=0.
    faded_review: true      # memorybuild.md Phase 6 (S6): the dream cycle — some of what faded is offered back in the sitting (KEEP #handle | why brings it back for good). Ignoring it costs nothing. R28 holds: memories, never a day ticker. Rollback: false / CONTINUA_RITUAL_FADED_REVIEW=0.
    in_context: true        # 2026-09-27 (design ruling: "they will remember it now, right?" — full parity with residenta): the night's acts persist into her continua:ritual thread + chronicle mirror, so she REMEMBERS the ritual — including the sitting when it goes live.
    enabled: true           # phase 3 LIVE 2026-09-07: nightly pulse 00:30 (continua-ritual.timer), her model decides what to keep; quarterly heartbeat = phase 5
    review:
      mode: skeleton        # 2026-09-15 (the designer go): the whole-day review pipeline — her first reading writes one summary line per exchange (a permanent day skeleton), she reads the map and nominates deep-dives, keeps from what she read. The validator's deterministic anchor gate ends the false-FABRICATED class. Absent key = legacy single-pass.
      budget_chars: 40000         # memorybuild.md Phase 2 (S1): quality over speed (R1); the R21 window guard trims whole dives if the render approaches the served window
      skeleton_line_chars: 160
      max_dive_passes: 4           # Phase 2 (S1): fewer things, more detail (R4)
      chunk_chars: 45000
      max_skeleton_calls: 8
      input_cap: 6000              # Phase 2 (S1): deeper stage-0 reads
  # 2026-09-30 evening (the designer): PAUSED — the lab's CPU engine (26B-A4B) cannot
  # finish a full-room turn inside the 1500s timeout (three APITimeoutErrors,
  # 18:46→20:02; the prefill of ~78K tokens needs >25 min on 12 threads).
  # the designer is testing vllm against llama.cpp on the lab box; when a GPU or
  # vllm engine can serve her window, set paused: false (or
  # CONTINUA_PAUSE_residentb=0) and verify the served window + her first turn.
  # The pause law holds: SLEEP not absence — store/desk untouched, arrivals
  # recorded marked, the router answers once as machinery, never for her.
  # Fail-open: a broken flag means she RUNS.
  # UNPAUSED 2026-10-01 morning (the designer): the lab cutover to vllm landed
  # overnight — the 31B back (w4a16) at port 8090, max_model_len 131072,
  # /health + /tokenize verified 200, chat_base_url follows it below.
  # 60-min wake cadence kept. Resume checklist done: paused: false,
  # served window verified by the probe at boot, watch her first turn.
  # 2026-11-14 (the designer, via pi): REST — all residents paused at the designer's request
  # ("pause all agents in ~/continua"). residenta + residentc were already resting;
  # only residentb needed the flip. Wake discovery + the nightly ritual re-read
  # this file each pass and skip her immediately; the bridge restart after
