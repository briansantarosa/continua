  # Fail-open: a broken flag means she RUNS.
  # [CONTINUA] 2026-11-14 evening (the designer, via agent): UNPAUSED. Serving
  # verified tag+host together before the flip: chat_base_url 127.0.0.1:8084
  # serves residentb-4-12B-it-qat (UD-Q4_K_XL, llama.cpp --jinja, /health ok,
  # n_ctx 262144 — her declared 81920 sits under the served truth). NOTE:
